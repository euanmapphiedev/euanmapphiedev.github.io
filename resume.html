<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume | Euan McPhie</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .resume-header {
      padding: 64px 0 36px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--border);
    }

    .resume-header h1 {
      font-size: clamp(28px, 4vw, 44px);
    }

    /* The PDF viewer — takes up most of the screen height */
    .pdf-wrapper {
      padding: 40px 0 64px;
    }

    .pdf-viewer {
      width: 100%;
      height: 85vh;           /* 85% of the screen height */
      min-height: 600px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      display: block;
    }

    /* Fallback message if browser can't embed the PDF */
    .pdf-fallback {
      display: none;
      padding: 48px;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      text-align: center;
    }

    .pdf-fallback p {
      margin-bottom: 20px;
      max-width: none;
    }

    @media (max-width: 768px) {
      .resume-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 20px;
      }
      .pdf-viewer {
        height: 70vh;
      }
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html" class="nav-logo">EM / GIS</a>
    <button class="nav-toggle" aria-label="Toggle menu" onclick="document.querySelector('.nav-links').classList.toggle('open')">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="portfolio.html">Portfolio</a></li>
      <li><a href="resume.html" class="active">Resume</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <main>

    <div class="resume-header">
      <h1>Resume</h1>
      <!-- Download link — opens PDF as download rather than in browser -->
      <a href="assets/resume.pdf" download="Euan_Mapphie_Resume.pdf" class="btn btn-dark">
        Download PDF
      </a>
    </div>

    <div class="pdf-wrapper">
      <!--
        The <object> tag embeds the PDF directly in the browser.
        If the browser supports it (all modern browsers do), it shows inline.
        If not, the .pdf-fallback div shows instead.

        TO USE: drop your resume PDF into assets/resume.pdf
        The file must be called exactly resume.pdf (or update the path below)
      -->
      <object
        data="assets/resume.pdf"
        type="application/pdf"
        class="pdf-viewer"
        aria-label="Euan Mapphie Resume PDF"
        onload="document.querySelector('.pdf-fallback').style.display='none'"
        onerror="this.style.display='none'; document.querySelector('.pdf-fallback').style.display='block'"
      >
        <!-- Fallback for browsers that can't embed PDFs (rare) -->
        <div class="pdf-fallback" style="display:block;">
          <p>Your browser doesn't support inline PDFs.</p>
          <a href="assets/resume.pdf" download="Euan_Mapphie_Resume.pdf" class="btn btn-dark">
            Download Resume
          </a>
        </div>
      </object>

      <div class="pdf-fallback">
        <p>PDF preview unavailable — download to view.</p>
        <a href="assets/resume.pdf" download="Euan_Mapphie_Resume.pdf" class="btn btn-dark">
          Download Resume
        </a>
      </div>
    </div>

  </main>

  <footer>
    <span class="footer-left">© 2026 Euan Mapphie</span>
    <ul class="footer-links">
      <li><a href="https://github.com/euanmapphiedev" target="_blank" rel="noopener">GitHub</a></li>
      <li><a href="https://linkedin.com/in/https://www.linkedin.com/in/euan-mcphie/" target="_blank" rel="noopener">LinkedIn</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </footer>

</body>
</html>
